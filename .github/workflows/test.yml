name: Python package

# Pull requests are tested via `pull_request`; `push` only covers the long-lived
# branches, so a PR branch is not tested twice (once per event).
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

# A newer push to the same PR/branch makes the in-progress run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
      pytest_args: ${{ steps.select.outputs.pytest_args }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # On pull requests, run only the tests of the learner(s) touched, unless
      # shared code changed (see .github/scripts/select_tests.py). Pushes to
      # develop/main and manual runs always run the full suite.
      - name: Select tests
        id: select
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed_files.txt
            selection=$(python .github/scripts/select_tests.py < changed_files.txt)
          else
            selection=ALL
          fi
          echo "Selected: $selection"
          case "$selection" in
            NONE) echo "run=false" >> "$GITHUB_OUTPUT"; echo "pytest_args=" >> "$GITHUB_OUTPUT" ;;
            ALL)  echo "run=true"  >> "$GITHUB_OUTPUT"; echo "pytest_args=" >> "$GITHUB_OUTPUT" ;;
            *)    echo "run=true"  >> "$GITHUB_OUTPUT"; echo "pytest_args=$selection" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Safety net: a healthy run takes ~35-45 minutes. Without this, a hung
    # step (e.g. #622) runs until GitHub's ~360min default job timeout
    # instead of failing fast and visibly.
    timeout-minutes: 90
    services:
      fuseki:
        image: stain/jena-fuseki
        ports:
          - 3030:3030
        options: >-
          --health-cmd "curl --silent --fail http://localhost:3030 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          ADMIN_PASSWORD: admin

    strategy:
      matrix:
        python-version: ["3.11.14"]
      max-parallel: 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip3 install -e .["full"]      

      - name: Lint with ruff
        run: |
          ruff check ontolearn/learners --exclude ontolearn/learners/spell_kit --line-length=200

      - name: Get external files
        run: |
          wget https://files.dice-research.org/projects/Ontolearn/KGs.zip
          wget https://files.dice-research.org/projects/Ontolearn/LPs.zip
          wget https://files.dice-research.org/projects/Ontolearn/CLIP/CLIPData.zip
          wget https://files.dice-research.org/projects/NCES/NCES_Ontolearn_Data/NCESData.zip
          unzip KGs.zip && unzip LPs.zip && unzip NCESData.zip && unzip CLIPData.zip

      - name: Wait for Fuseki to start
        run: |
          echo "Waiting for Fuseki to be ready..."
          until curl -s http://localhost:3030; do
            sleep 2
          done
          echo "Fuseki is up!"

      - name: Create dataset (mutagenesis)
        run: |
          curl -X POST http://localhost:3030/$/datasets \
            --user admin:admin \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data "dbName=mutagenesis&dbType=tdb"

      - name: Load OWL data into Fuseki
        run: |
          curl -X PUT -H "Content-Type: application/rdf+xml" \
            --data-binary @KGs/Mutagenesis/mutagenesis.owl \
            http://localhost:3030/mutagenesis/data \
            --user admin:admin

      - name: Testing and coverage report
        run: |
          pip install coverage
          coverage run -m pytest -p no:warnings -x --durations=0 ${{ needs.changes.outputs.pytest_args }}
          coverage report -m
