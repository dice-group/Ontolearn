services:
  # ─── Ontolearn Webservice ───────────────────────────────────────────
  ontolearn:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ontolearn-webservice
    ports:
      - "8000:8000"
    volumes:
      - ./KGs:/app/KGs:ro            # Mount knowledge graphs (read-only)
      - ./LPs:/app/LPs:ro            # Mount learning problems (read-only)
      - ./checkpoints:/app/checkpoints  # Mount model checkpoints
    environment:
      - KNOWLEDGE_BASE_PATH=KGs/Family/family-benchmark_rich_background.owl
    command: >
      ontolearn-webservice
      --path_knowledge_base KGs/Family/family-benchmark_rich_background.owl
      --host 0.0.0.0
      --port 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Ontolearn with Triplestore Backend ─────────────────────────────
  ontolearn-triplestore:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ontolearn-triplestore
    ports:
      - "8001:8000"
    depends_on:
      fuseki:
        condition: service_started
    command: >
      ontolearn-webservice
      --endpoint_triple_store http://fuseki:3030/family/sparql
      --host 0.0.0.0
      --port 8000
    profiles:
      - triplestore
    restart: unless-stopped

  # ─── Apache Jena Fuseki Triplestore ─────────────────────────────────
  fuseki:
    image: stain/jena-fuseki
    container_name: ontolearn-fuseki
    ports:
      - "3030:3030"
    environment:
      - ADMIN_PASSWORD=pw123
    volumes:
      - fuseki_data:/fuseki
    profiles:
      - triplestore
    restart: unless-stopped

  # ─── Development Container ─────────────────────────────────────────
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: ontolearn-dev
    volumes:
      - .:/app
    profiles:
      - dev
    stdin_open: true
    tty: true

  # ─── Test Runner ───────────────────────────────────────────────────
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: ontolearn-test
    volumes:
      - .:/app
    profiles:
      - test

volumes:
  fuseki_data:

